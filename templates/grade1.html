
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وثائق الصف الأول الثانوي تمريض</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d63031; 
            --primary-light: rgba(214, 48, 49, 0.1);
            --secondary: #e17055;
            --accent: #ff7675;
            --dark: #2d3436;
            --light: #fdfafb;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(214, 48, 49, 0.15);
            --radius: 18px;
        }

        /* FIX: Removed global transition: all */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: #fcf8f8;
            color: var(--dark);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            position: relative;
            height: 320px;
            background: url('https://img.freepik.com/free-vector/abstract-medical-wallpaper-design_23-2149116602.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: var(--shadow);
        }

        header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(214, 48, 49, 0.9), rgba(225, 112, 85, 0.8));
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }

        .header-content { position: relative; z-index: 2; }
        h1 { font-size: 2.3rem; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.2); margin-bottom: 10px; }

        .creator-label {
            margin-top: 15px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            font-weight: 700;
            transition: background 0.3s ease; /* Specific transition */
        }
        .creator-label:hover { background: rgba(255, 255, 255, 0.3); }

        .main-container { max-width: 1100px; margin: -50px auto 0; padding: 0 20px; position: relative; z-index: 5; }

        .search-area {
            background: var(--white);
            padding: 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-box { flex: 1; }
        #searchInput {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #fceaea;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #searchInput:focus { border-color: var(--primary); background: #fffafa; box-shadow: 0 0 0 4px var(--primary-light); }

        #refreshBtn {
            width: 55px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        #refreshBtn:active { transform: scale(0.95); }

        .cat-container { margin-bottom: 30px; position: relative; }
        .cat-grid {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 10px 5px 20px;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            cursor: grab;
        }
        .cat-grid::-webkit-scrollbar { display: none; }

        .cat-card {
            flex: 0 0 auto;
            min-width: 120px;
            background: var(--white);
            padding: 15px 10px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 2px solid transparent;
            font-size: 0.85rem;
            font-weight: 800;
            scroll-snap-align: start;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s, color 0.3s;
        }

        .cat-card.active {
            border-color: var(--primary);
            background: #fff5f5;
            color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.15);
        }

        .cat-card i { display: block; font-size: 1.6rem; margin-bottom: 8px; font-style: normal; }

        /* FIX: Optimized grid layout stability */
        #fileList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
            align-items: start; /* Prevents uneven card stretching */
            min-height: 400px; /* Prevents page jump when clearing list */
        }

        .file-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(214, 48, 49, 0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
            will-change: transform, opacity; /* Perf optimization */
            min-height: 200px; /* Layout stabilization */
            display: flex;
            flex-direction: column;
        }

        .file-card:hover { transform: translateY(-8px); border-color: var(--primary); }

        .file-type-icon {
            width: 45px; height: 45px;
            background: #fff5f5;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin-bottom: 15px;
            color: var(--primary);
        }

        .file-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 12px; color: var(--dark); line-height: 1.4; flex-grow: 1; }

        .file-badge {
            font-size: 0.7rem;
            padding: 4px 12px;
            background: #fff1f1;
            color: var(--primary);
            border-radius: 6px;
            font-weight: 800;
            margin-left: 5px;
        }

        .file-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
        .btn { padding: 12px; border-radius: 10px; text-decoration: none; text-align: center; font-size: 0.85rem; font-weight: 800; transition: background 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-preview { background: #f1f2f6; color: var(--dark); }
        .btn-download { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(214, 48, 49, 0.2); }

        #aboutModal {
            position: fixed; inset: 0; background: rgba(45, 52, 54, 0.6); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .about-card { 
            background: white; padding: 35px; border-radius: 30px; width: 90%; max-width: 400px; text-align: center; 
            opacity: 0; transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
        .about-card.show { opacity: 1; transform: scale(1); }

        @media (max-width: 600px) {
            h1 { font-size: 1.7rem; }
            #fileList { grid-template-columns: 1fr; }
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>وثائق الصف الأول الثانوي تمريض</h1>
        <p>مكتبتك الرقمية الذكية لتفوقك الدراسي</p>
        <div class="creator-label" onclick="toggleAbout()">
        🩺 The creator : Ibrahim Fayez
        </div>
    </div>
</header>

<div class="main-container">
    <div class="search-area">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن مادة، امتحان، أو مذكرة..." autocomplete="off">
        </div>
        <button id="refreshBtn" onclick="doRefresh()" title="تحديث الملفات">⟳</button>
    </div>

    <div class="cat-container">
        <div class="cat-grid" id="catGrid">
            <div class="cat-card active" data-cat="الكل"><i>🏥</i>الكل</div>
            <div class="cat-card" data-cat="مبادئ وأسس"><i>📋</i>مبادئ وأسس</div>
            <div class="cat-card" data-cat="تشريح"><i>🦴</i>تشريح</div>
            <div class="cat-card" data-cat="فسيولوجي"><i>🧬</i>فسيولوجي</div>
            <div class="cat-card" data-cat="امتحانات"><i>📝</i>امتحانات</div>
            <div class="cat-card" data-cat="ثقافية"><i>📚</i>ثقافية ودينية</div>
            <div class="cat-card" data-cat="اخري"><i>📁</i>أخرى</div>
        </div>
    </div>

    <div id="fileList"></div>
</div>

<div id="aboutModal" onclick="toggleAbout()">
    <div class="about-card" onclick="event.stopPropagation()">
        <h2 style="color:var(--primary); font-weight:900">إبراهيم فايز فوزي حسن</h2>
        <p style="margin:10px 0; color:#666; font-weight:700">طالب بالصف الثالث الثانوي تمريض</p>
        <div style="background: #fff5f5; padding: 12px; border-radius: 12px; margin: 15px 0;">
            <p style="font-weight:700; color:var(--primary)">📍 مقيد بالمجمع الطبي الدولي</p>
        </div>
        <a href="tel:01040175436" style="display:inline-block; padding: 10px 20px; background:var(--dark); color:white; border-radius:10px; text-decoration:none; font-weight:900;">01040175436</a>
    </div>
</div>

<script>
    const GROUP = new URLSearchParams(window.location.search).get("group") || "grade1";
    let allFiles = [];
    let currentCat = 'الكل';
    let searchTimeout;

    const mapping = {
        'مبادئ وأسس': ['مبادئ', 'اسس', 'أسس', 'تمريض', 'أساسيات', 'اساسيات', 'fundamentals', 'nursing'],
        'تشريح': ['تشريح', 'اناطومي', 'anatomy', 'جسم الإنسان', 'العظام'],
        'فسيولوجي': ['فسيولوجي', 'physiology', 'وظائف أعضاء', 'وظائف اعضاء', 'القلب', 'التنفس'],
        'امتحانات': ['امتحان', 'امتحانات', 'exam', 'اسئلة', 'أسئلة', 'مراجعة', 'مراجعات','إمتحان'],
        'ثقافية': ['عربي', 'عربية', 'دين', 'اسلامية', 'إسلامية', 'التربية', 'حاسب', 'إحصاء', 'احصاء', 'لغة', 'إنجليزي', 'english','العلوم','علوم'],
        'اخري': []
    };

    // Helper functions
    function cleanFileName(name) {
        return name.replace(/قناة|تمريضيانو|[\-_]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function detectCategory(name) {
        const lowerName = name.toLowerCase();
        for (let [cat, keys] of Object.entries(mapping)) {
            if (cat === 'اخري') continue;
            if (keys.some(k => lowerName.includes(k))) return cat;
        }
        return 'اخري';
    }

    function fmtSize(b){
        if(!b) return '---';
        return b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
    }

    /**
     * Optimized Data Processing
     * Calculates categories and names once to save performance during search/filter
     */
    function processFiles(files) {
        return files.map(f => ({
            ...f,
            displayName: cleanFileName(f.name),
            category: detectCategory(f.name),
            searchKey: f.name.toLowerCase()
        }));
    }

    function render() {
        requestAnimationFrame(() => {
            const list = document.getElementById('fileList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            // Optimization: Filter logic uses pre-computed 'category' and 'searchKey'
            const filtered = allFiles.filter(f => {
                const matchesSearch = f.searchKey.includes(search);
                if(currentCat === 'الكل') return matchesSearch;
                return matchesSearch && (f.category === currentCat);
            });

            const fragment = document.createDocumentFragment();
            
            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = "grid-column:1/-1;text-align:center;padding:100px 20px;color:#999;font-weight:700";
                empty.innerText = "لا توجد ملفات في هذا القسم حالياً..";
                fragment.appendChild(empty);
            } else {
                filtered.forEach((f, i) => {
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    
                    // FIX: Animation delay capped to first 20 items to prevent layout lag on long lists
                    if (i < 20) {
                        card.style.animation = `slideUp 0.4s ease backwards ${i * 0.04}s`;
                    }

                    card.innerHTML = `
                        <div class="file-type-icon">📄</div>
                        <div class="file-name">${f.displayName}</div>
                        <div class="file-meta">
                            <span class="file-badge">القسم: ${f.category}</span>
                            <span class="file-badge" style="background:#f1f2f6; color:#777">📦 ${fmtSize(f.size)}</span>
                        </div>
                        <div class="file-actions">
                            <a href="/api/stream/${f.id}?group=${GROUP}" target="_blank" class="btn btn-preview">👁 معاينة</a>
                            <a href="/api/stream/${f.id}?group=${GROUP}&dl=1" class="btn btn-download">⬇ تحميل</a>
                        </div>
                    `;
                    fragment.appendChild(card);
                });
            }
            
            // FIX: Fast clear and replace to minimize reflow
            list.innerHTML = '';
            list.appendChild(fragment);
        });
    }

    // Event Handlers
    document.getElementById('catGrid').addEventListener('click', (e) => {
        const card = e.target.closest('.cat-card');
        if (!card) return;
        
        currentCat = card.dataset.cat;
        document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        render();
    });

    // Debounced Search
    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(render, 100); // Faster response time for modern CPUs
    });

    async function loadData() {
        try {
            const res = await fetch(`/api/files?group=${GROUP}`);
            const data = await res.json();
            allFiles = processFiles(data);
            render();
        } catch(e) { console.error("Load Error"); }
    }

    function toggleAbout() {
        const modal = document.getElementById('aboutModal');
        const card = modal.querySelector('.about-card');
        if(modal.style.display === 'flex') {
            card.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        } else {
            modal.style.display = 'flex';
            setTimeout(() => card.classList.add('show'), 10);
        }
    }

    async function doRefresh() {
        const btn = document.getElementById('refreshBtn');
        btn.innerHTML = '⌛';
        try {
            const res = await fetch(`/api/refresh?group=${GROUP}`, { method:'POST' });
            const data = await res.json();
            allFiles = processFiles(data.files);
            render();
        } catch(e) { alert("فشلت المزامنة!"); }
        finally { btn.innerHTML = '⟳'; }
    }

    // Scroll drag support for categories
    const slider = document.getElementById('catGrid');
    let isDown = false, startX, scrollLeft;
    slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
    slider.addEventListener('mouseleave', () => isDown = false);
    slider.addEventListener('mouseup', () => isDown = false);
    slider.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 2;
        slider.scrollLeft = scrollLeft - walk;
    });

    loadData();
</script>
</body>
</html>
