<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنبيه إعادة التوجيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-blue: #0056ff;
            --main-red: #d90429;
            --main-green: #00a86b;
            --text-dark: #111111;
            --bg-page: #f0f2f5;
            --text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
            --box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            text-shadow: var(--text-shadow);
        }

        body {
            background-color: var(--bg-page);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        /* تصغير الكارت */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px; /* تم تقليل العرض من 500 إلى 380 */
            padding: 2rem 1.5rem 1.5rem; /* تقليل الهوامش الداخلية */
            border-radius: 25px;
            box-shadow: var(--box-shadow);
            text-align: center;
            border: 2px solid #e1e8ed;
            position: relative;
        }

        .header-msg {
            font-size: 1.4rem; /* تصغير حجم الخط ليناسب الكارت الصغير */
            font-weight: 800;
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        .sub-msg {
            font-size: 0.95rem;
            font-weight: 500;
            color: #444;
            margin-bottom: 1.5rem;
        }

        .timer-container {
            margin-bottom: 1.5rem;
        }

        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--main-red);
            background: #fff0f0;
            width: 75px; /* تصغير حجم دائرة العداد */
            height: 75px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 3px solid var(--main-red);
            box-shadow: 0 4px 8px rgba(217, 4, 41, 0.15);
        }

        .link-title {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--main-green);
            margin-bottom: 8px;
            text-align: right;
            padding-right: 5px;
        }

        .url-box {
            background: #f0fff4;
            border: 2px solid var(--main-green);
            padding: 1rem; /* تقليل الـ padding */
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .url-text {
            color: var(--main-green);
            font-family: monospace;
            font-weight: 700;
            font-size: 0.85rem; /* تصغير حجم الخط */
            word-break: break-all;
            display: block;
            text-shadow: none;
        }

        .redirect-btn {
            background: var(--main-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 86, 255, 0.25);
            margin-bottom: 1.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .credit-footer {
            padding-top: 1rem;
            border-top: 2px solid #f1f5f9;
            color: #555;
            font-size: 0.85rem;
            font-weight: 700;
        }

        #copyToast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            transition: bottom 0.4s;
            z-index: 1000;
        }
        #copyToast.visible { bottom: 20px; }
    </style>
</head>
<body>

    <div id="copyToast">تم نسخ الرابط! 📋</div>

    <div class="card">
        <h1 class="header-msg">بس هنا رايح فين ...... 😂</h1>
        <p class="sub-msg">تم تغيير لينك الموقع بالكامل<br>مستنيك هناك 😎</p>

        <div class="timer-container">
            <div class="timer-display" id="timeCount">15</div>
        </div>

        <span class="link-title">الرابط الجديد:</span>
        <div class="url-box" onclick="handleCopy()">
            <span class="url-text">https://my.nursing.workers.dev/</span>
        </div>

        <button class="redirect-btn" onclick="doRedirect()">فهمت [تحويل الآن]</button>

        <div class="credit-footer">
            مع تحيات / الطالب إبراهيم فايز
        </div>
    </div>

    <script>
        const targetUrl = "https://my.nursing.workers.dev/";
        let timeLeft = 15;
        const countEl = document.getElementById('timeCount');

        const interval = setInterval(() => {
            timeLeft--;
            countEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                doRedirect();
            }
        }, 1000);

        function doRedirect() { window.location.href = targetUrl; }

        function handleCopy() {
            navigator.clipboard.writeText(targetUrl).then(() => {
                const toast = document.getElementById('copyToast');
                toast.classList.add('visible');
                setTimeout(() => toast.classList.remove('visible'), 2000);
            });
        }
    </script>
</body>
</html>
